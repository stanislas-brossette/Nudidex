function shell(content){document.querySelector('#root').innerHTML=`<div class="app ${page==='collection'?'collection-page':''}"><header><div class="brand">nudidex<small>LE CARNET DES PETITES RENCONTRES</small></div><label class="region-picker"><span class="sr-only">Région</span><select aria-label="Région" onchange="setRegion(this.value)"><option ${region==='Mer Rouge'?'selected':''}>Mer Rouge</option><option ${region==='Méditerranée'?'selected':''}>Méditerranée</option></select></label></header>${content}</div>${nav()}`}
function go(p){page=p;selected=null;render();window.scrollTo(0,0)}
function card(i){let s=catalogue[i],st=status(i),cls=st==='À découvrir'?'discover':st==='Capturé'?'captured':'seen';return `<button class="card ${cls}" onclick="detail(${i})" aria-label="${esc(st)} · ${st==='À découvrir'?'espèce à découvrir':esc(s[1])}"><div class="img"><img src="${img(i)}" alt=""><span class="label" aria-hidden="true">${st==='À découvrir'?'':'✓'}</span>${st==='Capturé'?'<span class="camera-mark" aria-hidden="true">▣</span>':''}</div><div class="body"><strong>${st==='À découvrir'?'À découvrir':esc(s[1])}</strong></div></button>`}
function render(){if(page==='detail'){renderDetail();return}if(page==='collection'||page==='explorer'){let viewed=catalogue.filter((_,i)=>isInRegion(i)&&status(i)!=='À découvrir').length,captured=catalogue.filter((_,i)=>isInRegion(i)&&status(i)==='Capturé').length;let list=catalogue.map((_,i)=>i).filter(i=>isInRegion(i)&&(!uncertainRegions.has(i)||status(i)!=='À découvrir')&&(filter==='Tous'||status(i)===filter));shell(`<div class="hero"><div class="eyebrow">${page==='explorer'?'Un monde à découvrir':'Ton carnet de découvertes'}</div><h1>${page==='explorer'?'Explorer':'Ma collection'}</h1><p>${page==='explorer'?'Reconnais un nudi ? Ouvre sa fiche pour le retrouver.':'Une rencontre, une nouvelle histoire.'}</p><div class="stats"><div class="stat"><b>${viewed}</b> vus</div><div class="stat"><b>${captured}</b> capturés</div><div class="stat"><b>${region==='Méditerranée'?3:8}</b> espèces régionales</div></div></div>${page==='explorer'?`<div class="reef-banner" role="img" aria-label="Illustration aquarelle d’un récif" style="background-image:url(${reefArt})"></div><p class="reef-caption">Illustration décorative d’un récif</p>`:''}<div class="sectionhead"><div><div class="eyebrow">${page==='collection'?'Ta collection':'À rechercher'}</div><h2>${page==='collection'?'Petits trésors du récif':'Explorer les espèces'}</h2></div><span class="muted">${region} · ${region==='Méditerranée'?3:8} fiches</span></div><p class="sub">Reconnais un nudibranche ? Touche son dessin, puis « Je l’ai vu ».</p><div class="tabs">${['Tous','À découvrir','Vu','Capturé'].map(f=>`<button class="pill ${filter===f?'active':''}" onclick="filter=${JSON.stringify(f).replace(/"/g,'&quot;')};render()">${f}</button>`).join('')}</div><div class="grid">${list.map(card).join('')||'<p class="empty">Aucune espèce dans cette catégorie.</p>'}</div><div class="shell-decoration" aria-hidden="true"><span>♧ 〰 ♧</span><span>𓆝 〰 ♧</span></div><p class="safety-note">Illustrations indicatives : compare les détails avec la photo de référence. Tes observations sont enregistrées sur cet appareil.</p>`);return}if(page==='pending'){let a=state.obs.filter(o=>o.species===null);shell(`<div class="sectionhead"><div><div class="eyebrow">Retrouver plus tard</div><h1>À identifier</h1><p class="sub">Tes observations sans espèce attribuée.</p></div></div><div class="panel">${a.length?a.map(o=>`<div class="item"><div><strong>Rencontre à identifier</strong><p class="muted">${esc(oldSite(o)||'Site non renseigné')} · ${esc(o.notes||'')}</p><button class="secondary" onclick="identify('${esc(o.id)}')">Choisir dans les dessins</button></div>${o.photos?.[0]?`<img class="photo-mini" src="${o.photos[0]}" alt="Photo de l’observation">`:''}</div>`).join(''):'<p class="empty">Aucune observation à identifier.</p>'}</div>`);return}if(page==='identify'){let id=pendingId;shell(`<button class="back" onclick="go('pending')">← Retour</button><h1>Quel nudibranche ?</h1><p class="sub">Choisis le dessin qui ressemble à ton observation.</p><div class="grid" style="margin-top:20px">${catalogue.map((s,i)=>(uncertainRegions.has(i)||!isInRegion(i))?'':`<button class="card" onclick="assignSpecies('${esc(id)}',${i})"><div class="img"><img src="${pictures[i][0]}" alt="Dessin d’un nudibranche"></div><div class="body"><strong>Choisir celui-ci</strong></div></button>`).join('')}</div>`);return}if(page==='encounter'){encounterForm();return}}
let pendingId=null,editing=null;
function oldSite(o){return o.site || state.dives?.find(d=>d.id===o.dive)?.site || ''}function oldDate(o){return o.date || state.dives?.find(d=>d.id===o.dive)?.date || ''}
function identify(id){pendingId=id;page='identify';render()}async function assignSpecies(id,i){let o=state.obs.find(x=>x.id===id);if(!o)return;o.species=i;try{await save();detail(i)}catch(e){o.species=null;alert('Impossible d’enregistrer.')}}
function detail(i){selected=i;page='detail';render();window.scrollTo(0,0)}
function renderDetail(){let i=selected,s=catalogue[i],st=status(i),a=state.obs.filter(o=>o.species===i);shell(`<button class="back" onclick="go('collection')">← Retour à la collection</button><div class="eyebrow">${st} · ${uncertainRegions.has(i)?'Répartition à confirmer':(i>=10?'Méditerranée':'Mer Rouge')}</div><h1>${st==='À découvrir'?'Une rencontre à venir':esc(s[1])}</h1><p class="sub">${st==='À découvrir'?'Espèce à découvrir':esc(s[0])}</p><div class="panel"><img class="detailimg" src="${img(i)}" alt="Illustration de nudibranche"><div class="actions">${st==='À découvrir'?`<button class="primary" onclick="markSeen(${i})">✓ Je l’ai vu !</button>`:`<button class="primary" onclick="newEncounter(${i})">＋ Ajouter une rencontre</button><button class="secondary" onclick="addPhotoFromDetail(${i})">📷 Ajouter une photo</button>`}</div>${st!=='À découvrir'?`<div class="correction-actions">${st==='Capturé'?`<button type="button" class="correction-button" onclick="undoCapture(${i})">↶ Annuler « capturé »</button>`:''}<button type="button" class="correction-button" onclick="undoSeen(${i})">↶ Annuler « vu »</button></div>`:''}${verified[i]?.region?`<p class="note">${esc(verified[i].region)} ${verified[i].extra?`<a href="${verified[i].extra}" target="_blank" rel="noopener">Autre source ↗</a>`:''}</p>`:''}<div class="sectionhead"><h2>Indices de recherche</h2></div><p>${esc(s[2])}</p><div class="formgrid"><div><div class="eyebrow">Où chercher</div><p>${esc(s[3])}</p></div><div><div class="eyebrow">Alimentation</div><p>${esc(s[4])}</p></div></div><div class="formgrid"><div><div class="eyebrow">Taille</div><p>${esc(verified[i].size)}</p></div><div><div class="eyebrow">Milieu et profondeur</div><p>${esc(verified[i].depth)}</p></div></div><div class="eyebrow">À ne pas confondre</div><p>${esc(verified[i].confusion)}</p><p class="note">${uncertainRegions.has(i)?'Illustration générée indicative, non basée sur la photo de référence.':'Illustration générée à partir d’une photo de référence : les motifs peuvent être simplifiés.'} Compare avec la photo et la fiche source avant identification.</p>${verified[i].photo?`<div class="sectionhead"><h2>Photo de référence</h2></div>${!uncertainRegions.has(i)?`<p class="notice">Illustrations adaptées de la photo de ${esc(verified[i].photo[1])} · <a href="${verified[i].photo[2]}" target="_blank" rel="noopener">source</a> · <a href="${verified[i].photo[4]}" target="_blank" rel="noopener">${esc(verified[i].photo[3])}</a>. Photo modifiée par génération d’illustrations.</p>`:''}<p class="notice">Photo documentaire externe, distincte de ta collection. Elle est chargée uniquement si tu la demandes.</p><button class="secondary" type="button" onclick="showReference(${i})">Afficher la photo de référence</button><div id="reference-${i}"></div>`:`<p class="notice">Photo de référence : pas encore disponible.</p>`}<p class="notice">Informations résumées d’après la fiche scientifique liée. Les profondeurs indiquent des observations ou descriptions, pas des garanties de présence.</p><a class="source" href="${s[5]}" target="_blank" rel="noopener">Consulter la fiche scientifique ↗</a></div>${st!=='À découvrir'?`<div class="panel"><div class="sectionhead"><h2>Mes rencontres</h2><span class="counter">${a.length} rencontre(s)</span></div>${a.map(o=>`<div class="item"><div><strong>${esc(oldSite(o)||'Lieu à préciser')}</strong><p class="muted">${esc(oldDate(o)||'Date à préciser')}${o.depth!==''&&o.depth!=null?' · '+esc(o.depth)+' m':''}${o.capture?' · Photo capturée':''}</p>${o.notes?`<p class="muted">${esc(o.notes)}</p>`:''}<button class="secondary" onclick="editEncounter('${esc(o.id)}',${i})">Modifier / ajouter des détails</button></div>${o.photos?.[0]?`<img class="photo-mini" src="${o.photos[0]}" alt="Ma photo">`:''}</div>`).join('')}</div>`:''}`)}
async function undoCapture(i){let affected=state.obs.filter(o=>o.species===i&&o.capture);if(!affected.length)return;if(!confirm('Annuler toutes les captures de cette espèce ? Elle restera « vue » et tes photos et détails seront conservés.'))return;let old=affected.map(o=>o.capture);affected.forEach(o=>o.capture=false);try{await save();detail(i)}catch(e){affected.forEach((o,n)=>o.capture=old[n]);alert('Impossible d’enregistrer. Réessaie.')}}
async function undoSeen(i){let affected=state.obs.filter(o=>o.species===i);if(!affected.length)return;if(!confirm('Annuler « vu » pour cette espèce ? Ses rencontres et photos seront conservées dans « À identifier », afin de pouvoir les retrouver ou les attribuer à une autre espèce.'))return;affected.forEach(o=>o.species=null);try{await save();detail(i)}catch(e){affected.forEach(o=>o.species=i);alert('Impossible d’enregistrer. Réessaie.')}}
async function markSeen(i){let o={id:crypto.randomUUID(),species:i,photos:[],capture:false,site:'',date:'',depth:'',notes:''};state.obs.unshift(o);try{await save();detail(i)}catch(e){state.obs.shift();alert('Impossible d’enregistrer cette rencontre.')}}
function addPhotoFromDetail(i){let o=state.obs.find(x=>x.species===i);if(o)editEncounter(o.id,i);else newEncounter(i);setTimeout(()=>document.getElementById('photoInput')?.scrollIntoView({block:'center',behavior:'smooth'}),50)}
function newEncounter(i){selected=i;editing=null;page='encounter';render();window.scrollTo(0,0)}function editEncounter(id,i){selected=i;editing=id;page='encounter';render();window.scrollTo(0,0)}
function encounterForm(){let i=selected,o=state.obs.find(x=>x.id===editing)||{photos:[],capture:false,site:'',date:'',depth:'',notes:''};shell(`<button class="back" onclick="detail(${i})">← Retour à la fiche</button><div class="eyebrow">${editing?'Compléter ta rencontre':'Une nouvelle rencontre'}</div><h1>${editing?'Tes souvenirs':'Ajouter une rencontre'}</h1><p class="sub">${esc(catalogue[i][1])} · Tous les détails sont facultatifs</p><form class="panel" onsubmit="saveEncounter(event)"><div class="formgrid"><label>Site ou lieu<input name="site" value="${esc(oldSite(o))}" placeholder="Ex. : Ras Mohammed"></label><label>Date<input name="date" type="date" value="${esc(oldDate(o))}"></label><label>Profondeur en mètres<input name="depth" type="number" min="0" max="999" step="0.1" value="${esc(o.depth??'')}" placeholder="Ex. : 18"></label></div><label>Notes<textarea name="notes" placeholder="Où l’as-tu trouvé ?">${esc(o.notes||'')}</textarea></label><label>${o.photos?.length?'Ajouter d’autres photos':'Ajouter des photos'}<input id="photoInput" name="photos" type="file" accept="image/*" multiple onchange="showSelectedPhotos(this)"><span id="photoSelection" class="notice" aria-live="polite">Choisis une ou plusieurs images depuis ton téléphone.</span></label>${o.photos?.length?`<p class="notice">${o.photos.length} photo(s) déjà enregistrée(s).</p>`:''}<label><input type="checkbox" name="capture" style="width:auto;margin-right:8px" ${o.capture?'checked':''}>Je valide une photo comme capture</label><p class="notice">Pour valider une capture, ajoute au moins une photo.</p><button class="primary">Enregistrer</button></form>`)}
function showSelectedPhotos(input){let el=document.getElementById('photoSelection');if(el)el.textContent=input.files.length?Array.from(input.files).map(f=>f.name).join(', '):'Aucune photo sélectionnée.'}
function readFile(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveEncounter(e){e.preventDefault();let form=new FormData(e.target),i=selected,original=state.obs.find(x=>x.id===editing),files=form.getAll('photos').filter(x=>x.size);try{let photos=[...(original?.photos||[]),...await Promise.all(files.map(readFile))];if(form.get('capture')&&!photos.length){alert('Ajoute au moins une photo pour valider la capture.');return}let obj={...(original||{id:crypto.randomUUID(),species:i}),site:String(form.get('site')||'').trim(),date:form.get('date'),depth:form.get('depth'),notes:String(form.get('notes')||'').trim(),photos,capture:!!form.get('capture')};if(original){let index=state.obs.indexOf(original);state.obs[index]=obj;try{await save()}catch(err){state.obs[index]=original;throw err}}else{state.obs.unshift(obj);try{await save()}catch(err){state.obs.shift();throw err}}detail(i)}catch(err){alert('Enregistrement impossible. Si les photos sont volumineuses, essaie avec des fichiers plus légers.')}}
openDB().then(render).catch(()=>{document.querySelector('#root').textContent='Impossible d’ouvrir le stockage local de ce navigateur.'});
</script></body></html>
